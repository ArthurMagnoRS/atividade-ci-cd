name: "ci"
on: [push, pull_request]
jobs:
    job:
      name: testes
      runs-on: ubuntu-latest
      steps:
        - uses: $/.github/actions/checkout
        - uses: $/.github/actions/setup-node
          with:
            node-version: "22"
        - run: npm ci
        - run: npm test
        
        
        
          
